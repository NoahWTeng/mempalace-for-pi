name: CI

# Every job here runs on a GitHub-hosted runner, and that is what makes the
# trigger set safe. While this workflow targeted a self-hosted runner, a
# `pull_request` trigger would have handed any fork the ability to execute its
# own code on the maintainer's machine, so the trigger was deliberately limited
# to events that already require write access. Hosted runners are disposable and
# credential-free, so fork pull requests can — and must — be validated here.
#
# `scripts/gate-ci.sh` enforces the invariant that actually matters now: no job
# in this repository may declare a self-hosted runner. Reintroducing one while
# `pull_request` is present fails that gate rather than silently reopening the
# hole.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate that runs on every event, including fork pull requests. It is the
  # whole static contract — types, the full suite, and the public-tree boundary
  # — and it finishes in a couple of minutes, so it is the check that can
  # reasonably block a merge.
  quick:
    if: github.repository == 'NoahWTeng/mempalace-for-pi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The suite asks git whether the commit the matrix was attested at is
          # an ancestor of the commit under test — that is what stops evidence
          # from a different line of development being claimed here. A shallow
          # clone has no such history to answer from, so the check fails on a
          # correct tree for the wrong reason.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - run: |
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          export HOME="$state/home" npm_config_cache="$state/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null
          mkdir -p "$HOME"
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run check:repository

  # Packs the one candidate every matrix cell then measures. Skipped on pull
  # requests: a fork's tree is not a release candidate, and the identity checks
  # below are about what `main` would ship.
  candidate:
    if: github.repository == 'NoahWTeng/mempalace-for-pi' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - id: candidate
        run: |
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          export HOME="$state/home" npm_config_cache="$state/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          npm run check:repository
          candidate="$RUNNER_TEMP/release-candidate"
          rm -rf "$candidate"
          mkdir -p "$HOME" "$candidate"
          npm pack --pack-destination "$candidate"
          sha256="$(shasum -a 256 "$candidate"/*.tgz | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error

  # The eight-cell compatibility matrix. It installs a real MemPalace core and
  # drives Pi's whole package lifecycle per cell, so it costs roughly half an
  # hour and is not something to run on every commit. It is the deliberate
  # pre-release act that refreshes `.github/verification/task-967-matrix.json`,
  # which is why it is manual-only.
  macos-arm64:
    needs: candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.19.0, 24.x]
        pi-version: [0.84.2]
        mempalace-version: [3.6.0, 3.7.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The gate runs the suite, and the suite asks git whether the attested
          # commit is an ancestor of this one. A shallow clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
        # `gate-packaged.sh` provisions the real MemPalace core through uv, so uv
        # has to exist before the gate runs. The Linux cells get theirs from the
        # digest-pinned image `gate-ci.sh` names; macOS has no such image, so the
        # release binary is pinned by version and verified by checksum to the
        # same uv the Linux cells use. Taking whatever `brew` currently ships
        # would let the provisioning tool drift between the two halves of a
        # matrix whose entire purpose is to be exact.
      - name: Install the pinned uv
        env:
          UV_VERSION: 0.8.13
          UV_SHA256: c3eddc0e314abb8588f1cdf312f0b060d79e1906eff8f43b64a05ff5e2727872
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/uv.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-aarch64-apple-darwin.tar.gz"
          echo "$UV_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/uv-aarch64-apple-darwin/uv" "$RUNNER_TEMP/uv"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv" --version
      - run: |
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          export HOME="$state/home" PI_CODING_AGENT_DIR="$state/pi-agent" \
            npm_config_cache="$state/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null
          export EXPECTED_PLATFORM=darwin EXPECTED_ARCH=arm64 \
            EXPECTED_NODE_VERSION="${{ matrix.node-version }}" EXPECTED_SOURCE_COMMIT="${{ github.sha }}"
          # Outside "$state": the trap above deletes that directory when the
          # step ends, and the record has to outlive the step to be uploaded.
          export MEMPALACE_MATRIX_EVIDENCE="$RUNNER_TEMP/matrix-evidence.jsonl"
          : > "$MEMPALACE_MATRIX_EVIDENCE"
          mkdir -p "$HOME" "$PI_CODING_AGENT_DIR"
          npm ci --ignore-scripts
          test "$(node_modules/.bin/pi --version)" = "${{ matrix.pi-version }}"
          PI_BINARY="$PWD/node_modules/.bin/pi" \
            EXPECTED_CANDIDATE_SHA256="${{ needs.candidate.outputs.sha256 }}" \
            bash scripts/gate-release.sh \
              --tarball "$RUNNER_TEMP/release-candidate/mempalace-for-pi-0.1.0.tgz" \
              --mempalace-version "${{ matrix.mempalace-version }}"
          # A cell that passes but leaves no record cannot be aggregated, and a
          # matrix assembled from fewer cells than were run is the failure this
          # whole path exists to prevent. Fail here, where the cause is visible.
          test -s "$MEMPALACE_MATRIX_EVIDENCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrix-evidence-darwin-${{ matrix.node-version }}-${{ matrix.mempalace-version }}
          path: ${{ runner.temp }}/matrix-evidence.jsonl
          if-no-files-found: error

  # `ubuntu-24.04-arm` is arm64 hardware, so the digest-pinned ARM64 container
  # `gate-ci.sh` starts runs natively instead of under emulation. The container
  # is kept rather than running the gate directly on the host because it is what
  # pins the exact Node image each Linux cell is attested against.
  linux-arm64:
    needs: candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.19.0, 24.x]
        pi-version: [0.84.2]
        mempalace-version: [3.6.0, 3.7.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The container copies this checkout, suite and git history included,
          # so the ancestry check inside it needs the same full history.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
        # `gate-ci.sh` lints and guards the workflows before it starts any
        # container, so actionlint is a hard requirement of running it at all.
        # It was satisfied invisibly on the maintainer's machine. Pinned and
        # checksum-verified for the same reason uv is: a linter that silently
        # changes version changes what the gate accepts.
      - name: Install the pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint" --version
      - run: |
          bash scripts/gate-ci.sh --linux "${{ matrix.node-version }}" \
            --mempalace-version "${{ matrix.mempalace-version }}" \
            --tarball "$RUNNER_TEMP/release-candidate/mempalace-for-pi-0.1.0.tgz" \
            --sha256 "${{ needs.candidate.outputs.sha256 }}" \
            --commit "${{ github.sha }}" \
            --evidence "$RUNNER_TEMP/matrix-evidence.jsonl"
          test -s "$RUNNER_TEMP/matrix-evidence.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrix-evidence-linux-${{ matrix.node-version }}-${{ matrix.mempalace-version }}
          path: ${{ runner.temp }}/matrix-evidence.jsonl
          if-no-files-found: error

  # Joins the per-cell records into the file the release gate reads. This is the
  # step that used to be missing: the cells measured, printed, and then their
  # records died with the runner, so refreshing
  # `.github/verification/task-967-matrix.json` meant re-running everything
  # locally and assembling it by hand — which is exactly where a hand-written
  # digest gets into evidence.
  #
  # It deliberately does not commit. Writing to the repository would need
  # `contents: write`, and this workflow runs the full suite on fork pull
  # requests; the aggregate is published as an artifact for a human to download
  # and commit, which keeps CI read-only. Staleness is reported here and
  # *enforced* by `release.yml`, which refuses to publish a candidate the matrix
  # never attested.
  matrix-evidence:
    needs: [macos-arm64, linux-arm64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: matrix-evidence-*
          path: ${{ runner.temp }}/records
      - id: aggregate
        run: |
          set -euo pipefail
          node scripts/aggregate-matrix-evidence.mjs \
            --records "$RUNNER_TEMP/records" \
            --out "$RUNNER_TEMP/task-967-matrix.json"
          committed=.github/verification/task-967-matrix.json
          if node scripts/aggregate-matrix-evidence.mjs \
               --records "$RUNNER_TEMP/records" --check "$committed"; then
            {
              echo "### Matrix evidence is current"
              echo
              echo "The committed evidence already describes this run. Nothing to commit."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Matrix evidence is stale"
              echo
              echo "This run measured a candidate the committed evidence does not describe."
              echo "Download the task-967-matrix artifact and commit it to"
              echo "$committed before tagging a release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-967-matrix
          path: ${{ runner.temp }}/task-967-matrix.json
          if-no-files-found: error
