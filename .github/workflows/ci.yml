name: CI

# These jobs run on a self-hosted runner, so the trigger set is part of the
# security boundary rather than a convenience. `push` to main and manual
# dispatch both require write access already. Adding `pull_request` would let
# any fork execute its own code on that machine; fork CI needs GitHub-hosted
# runners first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'NoahWTeng/mempalace-for-pi'
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - id: candidate
        run: |
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          export HOME="$state/home" npm_config_cache="$state/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          npm run check:repository
          candidate="$RUNNER_TEMP/release-candidate"
          rm -rf "$candidate"
          mkdir -p "$HOME" "$candidate"
          npm pack --pack-destination "$candidate"
          sha256="$(shasum -a 256 "$candidate"/*.tgz | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error

  macos-arm64:
    needs: candidate
    if: github.repository == 'NoahWTeng/mempalace-for-pi'
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.19.0, 24.x]
        pi-version: [0.84.2]
        mempalace-version: [3.6.0, 3.7.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - run: |
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          export HOME="$state/home" PI_CODING_AGENT_DIR="$state/pi-agent" \
            npm_config_cache="$state/npm-cache" NPM_CONFIG_USERCONFIG=/dev/null
          export EXPECTED_PLATFORM=darwin EXPECTED_ARCH=arm64 \
            EXPECTED_NODE_VERSION="${{ matrix.node-version }}" EXPECTED_SOURCE_COMMIT="${{ github.sha }}"
          mkdir -p "$HOME" "$PI_CODING_AGENT_DIR"
          npm ci --ignore-scripts
          test "$(node_modules/.bin/pi --version)" = "${{ matrix.pi-version }}"
          PI_BINARY="$PWD/node_modules/.bin/pi" \
            EXPECTED_CANDIDATE_SHA256="${{ needs.candidate.outputs.sha256 }}" \
            bash scripts/gate-release.sh \
              --tarball "$RUNNER_TEMP/release-candidate/mempalace-for-pi-0.1.0.tgz" \
              --mempalace-version "${{ matrix.mempalace-version }}"

  linux-arm64:
    needs: candidate
    if: github.repository == 'NoahWTeng/mempalace-for-pi'
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: true
      matrix:
        node-version: [22.19.0, 24.x]
        pi-version: [0.84.2]
        mempalace-version: [3.6.0, 3.7.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - run: |
          bash scripts/gate-ci.sh --linux "${{ matrix.node-version }}" \
            --mempalace-version "${{ matrix.mempalace-version }}" \
            --tarball "$RUNNER_TEMP/release-candidate/mempalace-for-pi-0.1.0.tgz" \
            --sha256 "${{ needs.candidate.outputs.sha256 }}" \
            --commit "${{ github.sha }}"
